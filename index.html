<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dff5ff">
  <title>Melly the Koala ✨</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap');

    :root {
      color-scheme: light;
      --ink: #31516b;
      --sky: #e8f8ff;
      --pink: #ffacc5;
      --blue: #70c9fa;
      --fur: #d7dce3;
      --shadow: #b6becb;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      overflow-x: hidden;
      color: var(--ink);
      font-family: "Nunito", "Trebuchet MS", sans-serif;
      background:
        radial-gradient(ellipse at 12% 18%, #fff 0 2px, transparent 3px),
        radial-gradient(ellipse at 86% 30%, #fff 0 3px, transparent 4px),
        linear-gradient(160deg, #effbff, #dff3ff 58%, #e8f8ec);
      background-size: 90px 90px, 120px 120px, auto;
    }

    button { font: inherit; }
    .scene {
      width: min(100%, 900px);
      padding: clamp(20px, 5vw, 42px);
      overflow: hidden;
      border: 3px solid rgba(255,255,255,.92);
      border-radius: 36px;
      background: rgba(255,255,255,.72);
      box-shadow: 0 22px 65px rgba(90, 151, 181, .19), inset 0 0 0 1px #d5f0ff;
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .eyebrow {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      margin: 0 0 6px;
      padding: 7px 13px;
      border-radius: 99px;
      color: #638ba2;
      background: #e9f8ff;
      font-size: .78rem;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 { margin: 0; color: #31516b; font-size: clamp(2.5rem, 8vw, 4.3rem); font-weight: 900; line-height: 1; letter-spacing: -.055em; }
    h1 span { color: #69bce9; }
    .subtitle { margin: 11px 0 0; color: #6d8b9e; font-size: clamp(.95rem, 2.5vw, 1.1rem); }

    .stage {
      position: relative;
      width: min(100%, 700px);
      height: clamp(285px, 47vw, 390px);
      margin: 12px auto 0;
    }
    .stage::before {
      position: absolute;
      right: 7%; bottom: 8%; left: 7%; height: 23%;
      border-radius: 50%; background: #d9f1dc; content: "";
    }
    .sparkle { position: absolute; z-index: 1; color: #ffcb67; animation: twinkle 1.8s ease-in-out infinite; }
    .sparkle.s1 { top: 16%; left: 21%; font-size: 24px; }
    .sparkle.s2 { top: 28%; right: 18%; font-size: 18px; animation-delay: .6s; }
    .sparkle.s3 { top: 9%; right: 35%; font-size: 15px; animation-delay: 1s; }

    .tree {
      position: absolute; z-index: 2; right: 5%; bottom: 9%; width: 28%; height: 77%;
      transform-origin: 50% 100%; animation: tree-sway 4s ease-in-out infinite;
    }
    .koala {
      position: absolute; z-index: 3; bottom: 6%; left: 20%; width: 53%; height: 91%;
      overflow: visible; transform-origin: 50% 100%; animation: koala-idle 2.7s ease-in-out infinite;
    }
    .koala .ear-inner { fill: #f5a9bd; }
    .koala .fur { fill: var(--fur); }
    .koala .fur-light { fill: #f8fbff; }
    .koala .fur-shadow { fill: var(--shadow); }
    .koala .nose { fill: #354458; }
    .koala .eye-white { fill: white; }
    .koala .iris { fill: #48aee9; stroke: #348fc9; stroke-width: 2; }
    .koala .pupil { fill: #163d62; }
    .koala .eye-glint { fill: white; }
    .koala .cheek { fill: #ffacc5; opacity: .68; }
    .koala .mouth { fill: none; stroke: #765a65; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .koala .brow { fill: none; stroke: #778393; stroke-width: 4; stroke-linecap: round; }
    .koala .expression, .koala .tear { display: none; }
    .koala .tear { fill: #66c8ff; }
    .koala .blush-extra { fill: #ff8faa; opacity: 0; }
    .koala .mouth-happy { display: block; }

    [data-mood="sad"] .koala .mouth-happy,
    [data-mood="excited"] .koala .mouth-happy,
    [data-mood="angry"] .koala .mouth-happy,
    [data-mood="shocked"] .koala .mouth-happy,
    [data-mood="cute"] .koala .mouth-happy,
    [data-mood="scared"] .koala .mouth-happy { display: none; }
    [data-mood="sad"] .koala .mouth-sad,
    [data-mood="excited"] .koala .mouth-excited,
    [data-mood="angry"] .koala .mouth-angry,
    [data-mood="shocked"] .koala .mouth-shocked,
    [data-mood="cute"] .koala .mouth-cute,
    [data-mood="scared"] .koala .mouth-scared { display: block; }
    [data-mood="sad"] .koala .brow-sad,
    [data-mood="angry"] .koala .brow-angry,
    [data-mood="scared"] .koala .brow-scared { display: block; }
    [data-mood="sad"] .koala .tear { display: block; }
    [data-mood="excited"] .koala .eye-stars,
    [data-mood="cute"] .koala .eye-hearts { display: block; }
    [data-mood="excited"] .koala .mouth-excited,
    [data-mood="shocked"] .koala .mouth-shocked { stroke-width: 3; }
    [data-mood="angry"] .koala .cheek { opacity: .2; }
    [data-mood="cute"] .koala .blush-extra { opacity: .85; }
    [data-mood="scared"] .koala .fur-shadow { fill: #c4cbd7; }

    .emotion-dock { position: relative; z-index: 4; margin: -2px auto 0; }
    .emotion-dock p { margin: 0 0 12px; color: #7591a3; font-size: .9rem; font-weight: 800; }
    .buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; }
    .mood-button, .dance-button {
      min-height: 42px; padding: 8px 14px; border: 2px solid #e3f2f8; border-radius: 99px;
      color: #52758b; background: #fff; cursor: pointer; font-size: .91rem; font-weight: 900;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease, border-color .18s ease;
    }
    .mood-button:hover, .dance-button:hover { transform: translateY(-3px); box-shadow: 0 7px 15px #8dbbd333; }
    .mood-button[aria-pressed="true"] { border-color: #93dcfb; color: #367ca2; background: #e9f8ff; box-shadow: 0 4px 12px #80cbed33; }
    .dance-button { margin-top: 15px; border-color: #ffd1de; color: #a64e70; background: #fff0f5; }
    .dance-button:active { transform: scale(.96); }
    .footer { margin: 16px 0 0; color: #8ca4b1; font-size: .83rem; }
    .footer strong { color: #e28da9; }

    .dancing .koala { animation: dance .48s ease-in-out infinite alternate; }
    .dancing .tree { animation: tree-dance .48s ease-in-out infinite alternate; }
    .dancing .sparkle { animation: twinkle .45s ease-in-out infinite alternate; }
    .dancing .sparkle.s2 { animation-delay: .1s; }

    @keyframes koala-idle { 0%,100% { transform: rotate(-1deg) translateY(0); } 50% { transform: rotate(1deg) translateY(-5px); } }
    @keyframes tree-sway { 0%,100% { transform: rotate(-1deg); } 50% { transform: rotate(1.5deg); } }
    @keyframes dance { from { transform: rotate(-9deg) translateY(-2px); } to { transform: rotate(9deg) translateY(-15px); } }
    @keyframes tree-dance { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
    @keyframes twinkle { 0%,100% { opacity: .45; transform: scale(.8) rotate(-12deg); } 50% { opacity: 1; transform: scale(1.2) rotate(12deg); } }

    @media (max-width: 520px) {
      .scene { border-radius: 27px; padding: 23px 15px; }
      .stage { height: 290px; }
      .koala { left: 12%; width: 60%; }
      .tree { right: 0; width: 32%; }
      .mood-button { padding: 7px 11px; font-size: .84rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene" data-mood="happy">
    <p class="eyebrow">🌿 Your new little friend</p>
    <h1>Meet <span>Melly</span>! <span aria-hidden="true">✨</span></h1>
    <p class="subtitle">A pocket-sized koala with a whole lot of feelings.</p>

    <section class="stage" aria-label="Melly the koala beside her favorite tree">
      <span class="sparkle s1" aria-hidden="true">✦</span>
      <span class="sparkle s2" aria-hidden="true">✧</span>
      <span class="sparkle s3" aria-hidden="true">✦</span>
      <svg class="tree" viewBox="0 0 220 310" role="img" aria-label="A cute leafy tree">
        <path d="M103 292c12-48 8-97 7-143l20 1c-4 58 8 103 20 142z" fill="#b98260"/>
        <path d="M116 189 72 143m55 32 42-49m-50 13-7-51" fill="none" stroke="#b98260" stroke-width="13" stroke-linecap="round"/>
        <path d="M43 149c-34-4-39-45-13-61-8-29 17-49 42-38 15-35 63-31 72-1 35-10 57 21 41 47 35 23 19 67-14 68-18 29-56 26-72 2-19 25-48 21-56-2z" fill="#8bd3a0"/>
        <path d="M66 103c-19-20 1-44 21-33m42-20c21-3 31 16 22 30m24 48c22-7 32 10 23 26M38 115c-16 5-18 23-8 31m80-74c-4-16 13-26 26-17" fill="none" stroke="#a8e3b2" stroke-width="11" stroke-linecap="round"/>
        <path d="M68 96c6-11 20-12 28-2-9 5-18 7-28 2zm78-20c12-8 25-1 25 11-10-2-18-6-25-11zm-63 56c7-11 22-11 28 0-10 4-20 4-28 0zm64 10c6-11 20-12 27-2-8 5-18 7-27 2z" fill="#d5f2c8"/>
        <path d="M99 291h55" stroke="#98674f" stroke-width="9" stroke-linecap="round"/>
        <circle cx="70" cy="72" r="4" fill="#fff2bd"/><circle cx="168" cy="111" r="4" fill="#fff2bd"/>
      </svg>

      <svg class="koala" viewBox="0 0 360 390" role="img" aria-label="Melly, a fluffy white and grey koala with sparkly blue eyes">
        <defs>
          <radialGradient id="earfluff" cx="45%" cy="40%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#c6ccd6"/></radialGradient>
          <filter id="softshadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#6c91aa" flood-opacity=".2"/></filter>
        </defs>
        <!-- feet and soft little body -->
        <g filter="url(#softshadow)">
          <ellipse class="fur-shadow" cx="180" cy="333" rx="99" ry="29"/>
          <ellipse class="fur" cx="180" cy="274" rx="91" ry="94"/>
          <ellipse class="fur-light" cx="180" cy="282" rx="55" ry="70"/>
          <ellipse class="fur-shadow" cx="120" cy="350" rx="40" ry="18"/>
          <ellipse class="fur-shadow" cx="240" cy="350" rx="40" ry="18"/>
          <ellipse class="fur-light" cx="119" cy="346" rx="23" ry="8"/>
          <ellipse class="fur-light" cx="241" cy="346" rx="23" ry="8"/>
          <!-- arms -->
          <ellipse class="fur-shadow" cx="96" cy="262" rx="28" ry="54" transform="rotate(24 96 262)"/>
          <ellipse class="fur" cx="262" cy="262" rx="28" ry="54" transform="rotate(-24 262 262)"/>
          <ellipse class="fur-light" cx="91" cy="287" rx="14" ry="18" transform="rotate(24 91 287)"/>
          <ellipse class="fur-light" cx="267" cy="287" rx="14" ry="18" transform="rotate(-24 267 287)"/>
          <!-- huge fluffy ears -->
          <circle cx="79" cy="99" r="65" fill="url(#earfluff)"/>
          <circle cx="281" cy="99" r="65" fill="url(#earfluff)"/>
          <circle class="ear-inner" cx="79" cy="99" r="39"/>
          <circle class="ear-inner" cx="281" cy="99" r="39"/>
          <circle cx="79" cy="99" r="27" fill="#ffd2df" opacity=".8"/>
          <circle cx="281" cy="99" r="27" fill="#ffd2df" opacity=".8"/>
          <!-- face -->
          <ellipse class="fur" cx="180" cy="168" rx="111" ry="111"/>
          <ellipse class="fur-light" cx="180" cy="177" rx="88" ry="91"/>
          <path class="fur-shadow" d="M81 153c9-44 38-77 76-88-22 33-27 73-16 108-22-12-41-17-60-20zm198 0c-9-44-38-77-76-88 22 33 27 73 16 108 22-12 41-17 60-20z" opacity=".72"/>
          <!-- eyes and shiny blue irises -->
          <ellipse class="eye-white" cx="137" cy="166" rx="26" ry="31"/>
          <ellipse class="eye-white" cx="223" cy="166" rx="26" ry="31"/>
          <ellipse class="iris" cx="139" cy="169" rx="17" ry="22"/>
          <ellipse class="iris" cx="221" cy="169" rx="17" ry="22"/>
          <ellipse class="pupil" cx="141" cy="171" rx="10" ry="15"/>
          <ellipse class="pupil" cx="219" cy="171" rx="10" ry="15"/>
          <circle class="eye-glint" cx="134" cy="160" r="7"/><circle class="eye-glint" cx="214" cy="160" r="7"/>
          <circle class="eye-glint" cx="146" cy="177" r="3"/><circle class="eye-glint" cx="226" cy="177" r="3"/>
          <g class="expression eye-stars" fill="#fff" stroke="#8edcff" stroke-width="2">
            <path d="m127 144 4 9 9 1-7 6 2 9-8-5-8 5 2-9-7-6 10-1z"/><path d="m226 141 3 7 8 1-6 5 2 8-7-4-7 4 2-8-6-5 8-1z"/>
          </g>
          <g class="expression eye-hearts" fill="#ff7fa8">
            <path d="M136 164c-14-10-1-23 7-12 8-11 21 2 7 12l-7 7z"/><path d="M216 164c-14-10-1-23 7-12 8-11 21 2 7 12l-7 7z"/>
          </g>
          <!-- brows change with mood -->
          <path class="brow brow-sad" d="m117 126 25 7m76-7-25 7"/>
          <path class="brow brow-angry" d="m116 140 28-10m100 10-28-10"/>
          <path class="brow brow-scared" d="m116 130 25-3m103 3-25-3"/>
          <!-- blush and nose -->
          <ellipse class="cheek" cx="107" cy="207" rx="20" ry="11"/><ellipse class="cheek" cx="253" cy="207" rx="20" ry="11"/>
          <ellipse class="blush-extra" cx="107" cy="207" rx="24" ry="15"/><ellipse class="blush-extra" cx="253" cy="207" rx="24" ry="15"/>
          <path class="nose" d="M157 191c0-13 12-21 23-21s23 8 23 21c0 12-12 25-23 25s-23-13-23-25z"/>
          <ellipse cx="170" cy="183" rx="6" ry="3" fill="#fff" opacity=".5"/>
          <!-- expressions -->
          <path class="mouth mouth-happy" d="M166 229q14 15 28 0"/>
          <path class="mouth mouth-sad" d="M164 239q16-17 32 0"/>
          <path class="mouth mouth-excited" d="M163 225q17 4 34 0v12q-17 19-34 0z" fill="#a95e72"/>
          <path class="mouth mouth-angry" d="M165 235q15-9 30 0"/>
          <ellipse class="mouth mouth-shocked" cx="180" cy="237" rx="9" ry="13"/>
          <path class="mouth mouth-cute" d="M166 230q8 11 14 0 7 11 14 0"/>
          <path class="mouth mouth-scared" d="M166 241q14-13 28 0"/>
          <path class="tear" d="M107 183c-3 10-10 16-8 24 2 8 13 8 15 0 2-7-4-14-7-24zm146 0c-3 10-10 16-8 24 2 8 13 8 15 0 2-7-4-14-7-24z"/>
          <!-- fluffy forehead tuft -->
          <path class="fur-light" d="M153 75q-3-18 10-27 0 16 12 23 4-20 20-25-5 20 5 31-23-8-47-2z"/>
        </g>
      </svg>
    </section>

    <section class="emotion-dock" aria-label="Choose Melly's mood">
      <p id="mood-caption" aria-live="polite">Melly is feeling happy! 💙</p>
      <div class="buttons" role="group" aria-label="Melly's feelings">
        <button class="mood-button" data-mood="happy" aria-pressed="true">😊 Happy</button>
        <button class="mood-button" data-mood="sad" aria-pressed="false">🥺 Sad</button>
        <button class="mood-button" data-mood="excited" aria-pressed="false">🤩 Excited</button>
        <button class="mood-button" data-mood="angry" aria-pressed="false">😠 Angry</button>
        <button class="mood-button" data-mood="shocked" aria-pressed="false">😮 Shocked</button>
        <button class="mood-button" data-mood="cute" aria-pressed="false">🥰 Cute</button>
        <button class="mood-button" data-mood="scared" aria-pressed="false">😳 Scared</button>
      </div>
      <button class="dance-button" id="dance-button" aria-pressed="false">💃 Make Melly dance!</button>
    </section>
    <p class="footer">Made with <strong>♡</strong> and eucalyptus leaves 🌱</p>
  </main>

  <script>
    const scene = document.querySelector('#scene');
    const caption = document.querySelector('#mood-caption');
    const danceButton = document.querySelector('#dance-button');
    const moodCopy = {
      happy: 'Melly is feeling happy! 💙',
      sad: 'Aww, Melly needs a cuddle. 🫂',
      excited: 'Yippee! Melly is SO excited! ✨',
      angry: 'Grr! Someone stole Melly’s eucalyptus! 🍃',
      shocked: 'Oh my gosh! What a surprise! 😮',
      cute: 'Melly is being extra adorable. 🥰',
      scared: 'It’s okay, Melly — you’re safe here. 💕'
    };

    document.querySelectorAll('.mood-button').forEach((button) => {
      button.addEventListener('click', () => {
        const mood = button.dataset.mood;
        scene.dataset.mood = mood;
        caption.textContent = moodCopy[mood];
        document.querySelectorAll('.mood-button').forEach((item) => {
          item.setAttribute('aria-pressed', String(item === button));
        });
      });
    });

    danceButton.addEventListener('click', () => {
      const dancing = scene.classList.toggle('dancing');
      danceButton.setAttribute('aria-pressed', String(dancing));
      danceButton.textContent = dancing ? '🛑 Dance party, stop!' : '💃 Make Melly dance!';
    });
  </script>
</body>
</html>
